# config/deploy.yml — Kamal 2 base configuration (shared across all environments)
#
# Deploy to a specific environment with:
#   kamal deploy -d production
#   kamal deploy -d development
#
# This base file is merged with config/deploy.<destination>.yml at deploy time.
# Destination files override any key defined here.

service: rupeerally
image: <your-registry-username>/rupeerally   # e.g. ghcr.io/yourgithubuser/rupeerally

# ── Container registry ────────────────────────────────────────────────────────
# GitHub Container Registry (ghcr.io) is free for public repos.
# KAMAL_REGISTRY_USERNAME and KAMAL_REGISTRY_PASSWORD come from .kamal/secrets.*
registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

# ── Shared environment variables ──────────────────────────────────────────────
# Non-secret config shared across all environments.
# Override or extend in deploy.<destination>.yml under env.clear / env.secret.
env:
  clear:
    RAILS_LOG_TO_STDOUT: "true"
    RAILS_SERVE_STATIC_FILES: "true"
    WEB_CONCURRENCY: "2"
    RAILS_MAX_THREADS: "3"

# ── Health check ──────────────────────────────────────────────────────────────
# Rails ships GET /up → 200 when healthy. Kamal gates traffic on this.
healthcheck:
  path: /up
  port: 3000
  max_attempts: 7
  interval: 5

# ── Persistent volumes ────────────────────────────────────────────────────────
volumes:
  - mom_storage:/rails/storage

# ── Asset bridge ──────────────────────────────────────────────────────────────
asset_path: /rails/public/assets

# ── Builder ───────────────────────────────────────────────────────────────────
builder:
  # Build on your local machine and push to registry.
  # Set multiarch: true if deploying to ARM servers from an x86 machine.
  multiarch: false
