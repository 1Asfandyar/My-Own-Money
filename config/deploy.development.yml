# config/deploy.development.yml — Development / staging environment overrides
#
# Activated with: kamal deploy -d development
# Merged on top of config/deploy.yml at deploy time.
#
# Replace every <placeholder> before first deploy.

# ── Servers ───────────────────────────────────────────────────────────────────
servers:
  web:
    - <your-staging-server-ip>     # e.g. 5.6.7.8
  job:
    hosts:
      - <your-staging-server-ip>
    cmd: bin/jobs start

# ── Environment variables ─────────────────────────────────────────────────────
env:
  clear:
    RAILS_LOG_LEVEL: "debug"
    CORS_ALLOWED_ORIGINS: "https://staging.<yourdomain.com>"
  secret:
    # Resolved from .kamal/secrets.development at deploy time
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET

# ── Proxy / TLS ───────────────────────────────────────────────────────────────
proxy:
  ssl: true
  host: staging.<yourdomain.com>    # Let's Encrypt auto-provisions SSL
  app_port: 3000

# ── Accessories ───────────────────────────────────────────────────────────────
accessories:
  db:
    image: postgres:17-alpine
    host: <your-staging-server-ip>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_DB: mom_development
      secret:
        - POSTGRES_USER
        - POSTGRES_PASSWORD
    volumes:
      - mom_postgres_development:/var/lib/postgresql/data
    options:
      restart: always
      shm-size: 256m
